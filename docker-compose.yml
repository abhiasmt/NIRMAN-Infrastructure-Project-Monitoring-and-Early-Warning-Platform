# NIRMAN — full local stack.
#   docker compose up --build
#   docker compose exec api npx prisma migrate deploy && docker compose exec api npm run seed
#
# Web UI      http://localhost:8080
# API         http://localhost:4000/api/v1   (docs at /api/docs)
# ML service  http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    container_name: nirman-db
    environment:
      POSTGRES_USER: nirman
      POSTGRES_PASSWORD: nirman
      POSTGRES_DB: nirman
    ports: ["5432:5432"]
    volumes: ["nirman_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirman"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build: ./ml-service
    container_name: nirman-ml
    ports: ["8000:8000"]
    volumes: ["./data:/data:ro"]

  api:
    build: ./server
    container_name: nirman-api
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://nirman:nirman@db:5432/nirman?schema=public
      ML_SERVICE_URL: http://ml:8000
      JWT_SECRET: local-dev-secret-change-me
      CORS_ORIGIN: http://localhost:8080
      PORT: 4000
      ENABLE_CRON: "false"
    ports: ["4000:4000"]
    volumes: ["./data:/data:ro"]

  web:
    build: ./web
    container_name: nirman-web
    depends_on: [api]
    ports: ["8081:80"]

volumes:
  nirman_pgdata:
